<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My AI</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background: #111;
      color: white;
      padding: 18px 24px;
      font-size: 20px;
      font-weight: bold;
    }

    #chat {
      flex: 1;
      padding: 24px;
      overflow-y: auto;
      max-width: 900px;
      width: 100%;
      margin: auto;
    }

    .message {
      margin-bottom: 18px;
      padding: 14px 18px;
      border-radius: 12px;
      max-width: 75%;
      line-height: 1.5;
    }

    .user {
      background: #111;
      color: white;
      margin-left: auto;
    }

    .ai {
      background: white;
      border: 1px solid #ddd;
    }

    #input-area {
      background: white;
      border-top: 1px solid #ddd;
      padding: 16px;
      display: flex;
      gap: 10px;
    }

    #message {
      flex: 1;
      padding: 14px;
      border: 1px solid #ccc;
      border-radius: 10px;
      font-size: 16px;
    }

    button {
      padding: 14px 20px;
      border: none;
      border-radius: 10px;
      background: #111;
      color: white;
      cursor: pointer;
      font-size: 16px;
    }

    button:hover {
      background: #333;
    }
  </style>
</head>

<body>

  <header>
    My AI
  </header>

  <div id="chat">
    <div class="message ai">
      Hello! I'm your personal AI. What would you like to work on?
    </div>
  </div>

  <div id="input-area">
    <input
      id="message"
      type="text"
      placeholder="Ask me anything..."
      autocomplete="off"
    >

    <button onclick="sendMessage()">Send</button>
  </div>

  <script>
    function sendMessage() {
      const input = document.getElementById("message");
      const chat = document.getElementById("chat");

      const text = input.value.trim();

      if (text === "") {
        return;
      }

      // Add user's message
      const userMessage = document.createElement("div");
      userMessage.className = "message user";
      userMessage.textContent = text;
      chat.appendChild(userMessage);

      input.value = "";

      // Temporary AI response
      const aiMessage = document.createElement("div");
      aiMessage.className = "message ai";
      aiMessage.textContent =
        "I received your message. We'll connect the real AI next.";
      chat.appendChild(aiMessage);

      chat.scrollTop = chat.scrollHeight;
    }

    document.getElementById("message").addEventListener("keydown", function(event) {
      if (event.key === "Enter") {
        sendMessage();
      }
    });
  </script>

</body>
</html>
