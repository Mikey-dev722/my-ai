<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My AI</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background: #111;
      color: white;
      padding: 18px 24px;
      font-size: 20px;
      font-weight: bold;
    }

    #chat {
      flex: 1;
      padding: 24px;
      overflow-y: auto;
      max-width: 900px;
      width: 100%;
      margin: auto;
    }

    .message {
      margin-bottom: 18px;
      padding: 14px 18px;
      border-radius: 12px;
      max-width: 75%;
      line-height: 1.5;
      white-space: pre-wrap;
    }

    .user {
      background: #111;
      color: white;
      margin-left: auto;
    }

    .ai {
      background: white;
      border: 1px solid #ddd;
    }

    #input-area {
      background: white;
      border-top: 1px solid #ddd;
      padding: 16px;
      display: flex;
      gap: 10px;
      max-width: 100%;
    }

    #message {
      flex: 1;
      padding: 14px;
      border: 1px solid #ccc;
      border-radius: 10px;
      font-size: 16px;
    }

    button {
      padding: 14px 20px;
      border: none;
      border-radius: 10px;
      background: #111;
      color: white;
      cursor: pointer;
      font-size: 16px;
    }

    button:hover {
      background: #333;
    }

    button:disabled {
      background: #777;
      cursor: not-allowed;
    }
  </style>
</head>

<body>

  <header>
    My AI
  </header>

  <div id="chat">
    <div class="message ai">
      Hello! I'm your personal AI. What would you like to work on?
    </div>
  </div>

  <div id="input-area">
    <input
      id="message"
      type="text"
      placeholder="Ask me anything..."
      autocomplete="off"
    >

    <button id="sendButton" onclick="sendMessage()">Send</button>
  </div>

  <script>
    const WORKER_URL =
      "https://my-ai-backend.michael-sherwood.workers.dev";

    async function sendMessage() {
      const input = document.getElementById("message");
      const chat = document.getElementById("chat");
      const button = document.getElementById("sendButton");

      const text = input.value.trim();

      if (!text) {
        return;
      }

      // Add user's message
      const userMessage = document.createElement("div");
      userMessage.className = "message user";
      userMessage.textContent = text;
      chat.appendChild(userMessage);

      // Clear input
      input.value = "";

      // Show thinking message
      const aiMessage = document.createElement("div");
      aiMessage.className = "message ai";
      aiMessage.textContent = "Thinking...";
      chat.appendChild(aiMessage);

      // Prevent multiple requests
      button.disabled = true;
      input.disabled = true;

      chat.scrollTop = chat.scrollHeight;

      try {
        const response = await fetch(WORKER_URL, {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            message: text
          })
        });

        const data = await response.json();

        if (!response.ok) {
          throw new Error(
            data.error || "The AI request failed."
          );
        }

        aiMessage.textContent = data.reply;

      } catch (error) {
        console.error(error);

        aiMessage.textContent =
          "Sorry, something went wrong: " + error.message;
      }

      button.disabled = false;
      input.disabled = false;
      input.focus();

      chat.scrollTop = chat.scrollHeight;
    }

    // Press Enter to send
    document
      .getElementById("message")
      .addEventListener("keydown", function(event) {
        if (event.key === "Enter") {
          sendMessage();
        }
      });
  </script>

</body>
</html>
